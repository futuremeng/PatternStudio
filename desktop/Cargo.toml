[package]
name = "patternstudio-desktop"
description = "PatternStudio desktop app (Tauri)"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["FutureMeng"]

[lib]
name = "patternstudio_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
patternstudio-core = { workspace = true }
patternstudio-tracer = { workspace = true }
patternstudio-patterns = { workspace = true }
patternstudio-engine = { workspace = true }
