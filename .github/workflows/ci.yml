name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache VTracer
        run: |
          git clone --depth 1 https://github.com/vtracer/vtracer.git /tmp/vtracer
      - name: Patch VTracer path
        run: |
          sed -i 's|path = "../../vtracer/crates/vtracer"|path = "/tmp/vtracer/crates/vtracer"|' Cargo.toml
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Format check
        run: cargo fmt --check