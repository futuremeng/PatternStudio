name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # vtracer is vendored in-tree at crates/vtracer (PatternStudio fork
      # commit 13435cf, with the custom Session / CancelToken / segment_key
      # APIs), so the checkout alone is sufficient — no sibling fetch or
      # Cargo.toml patching.
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Format check
        run: cargo fmt --check