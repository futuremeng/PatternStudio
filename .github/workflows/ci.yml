name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The workspace depends on the PatternStudio VTracer fork (custom
      # Session / CancelToken / segment_key APIs), pinned to a known-good
      # commit. All crates resolve vtracer through [workspace.dependencies],
      # so patching the root Cargo.toml is sufficient.
      - name: Fetch VTracer fork
        run: |
          git clone https://github.com/futuremeng/vtracer.git /tmp/vtracer
          git -C /tmp/vtracer checkout 13435cf
      - name: Patch VTracer path
        run: |
          sed -i 's|path = "[^"]*/vtracer/crates/vtracer"|path = "/tmp/vtracer/crates/vtracer"|' Cargo.toml
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Format check
        run: cargo fmt --check