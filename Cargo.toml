[workspace]
members = [
    "crates/patternstudio-core",
    "crates/patternstudio-tracer",
    "crates/patternstudio-svg",
    "crates/patternstudio-cli",
    "crates/patternstudio-patterns",
    "crates/patternstudio-server",
    "crates/patternstudio-py",
    "crates/patternstudio-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["FutureMeng"]
repository = "https://github.com/futuremeng/PatternStudio"

[workspace.dependencies]
# VTracer 1.0 (path dep during dev)
vtracer = { path = "../../vtracer/crates/vtracer" }
visioncortex = "0.9.3"
flo_curves = "0.8"

# Image I/O
image = "0.25"

# CLI
clap = { version = "4", features = ["derive"] }

# Language bindings
pyo3 = "0.29"
wasm-bindgen = "0.2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"

# Internal crates
patternstudio-core = { path = "crates/patternstudio-core" }
patternstudio-tracer = { path = "crates/patternstudio-tracer" }
patternstudio-svg = { path = "crates/patternstudio-svg" }
patternstudio-patterns = { path = "crates/patternstudio-patterns" }
patternstudio-server = { path = "crates/patternstudio-server" }

[profile.release]
lto = true
strip = true